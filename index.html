<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#15181c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Case Constructor — 3D-printable enclosures for boards</title>
  </head>
  <body class="kit-app">
    <header id="topbar" class="topbar">
      <span id="brand" class="brand">Case Constructor</span>
      <button
        id="presetBtn"
        type="button"
        class="preset-button"
        aria-haspopup="dialog"
        aria-expanded="false"
        data-i18n="kit.topbar.presets"
        data-i18n-title="topbar.presets.title"
        title="Built-in and saved presets"
      >
        Presets
      </button>
      <span class="spacer"></span>
      <!-- a phone breaks the bar here: the brand and the language above, the preset and the tools below -->
      <span class="topbar-break"></span>
      <div class="topbar-tools">
        <button
          id="newBtn"
          type="button"
          class="tool-button"
          title="New project"
          aria-label="New project"
          data-i18n-title="kit.topbar.new"
          data-i18n-aria="kit.topbar.new"
        >
          📄
        </button>
        <button
          id="saveBtn"
          type="button"
          class="tool-button"
          title="Save as a preset"
          aria-label="Save as a preset"
          data-i18n-title="kit.topbar.savePreset"
          data-i18n-aria="kit.topbar.savePreset"
        >
          💾
        </button>
        <button
          id="fileOpenBtn"
          type="button"
          class="tool-button"
          title="Open a project file (or drop the file onto the window)"
          aria-label="Open a project file"
          data-i18n-title="topbar.fileOpen.title"
          data-i18n-aria="kit.topbar.open"
        >
          📂
        </button>
        <button
          id="fileSaveBtn"
          type="button"
          class="tool-button"
          title="Save the project to a file"
          aria-label="Save the project to a file"
          data-i18n-title="kit.topbar.save"
          data-i18n-aria="kit.topbar.save"
        >
          ⬇️
        </button>
        <button
          id="undoBtn"
          type="button"
          class="tool-button"
          title="Undo (Ctrl+Z)"
          aria-label="Undo (Ctrl+Z)"
          data-i18n-title="kit.topbar.undo"
          data-i18n-aria="kit.topbar.undo"
          disabled
        >
          ↩&#xFE0E;
        </button>
        <button
          id="redoBtn"
          type="button"
          class="tool-button"
          title="Redo (Ctrl+Shift+Z)"
          aria-label="Redo (Ctrl+Shift+Z)"
          data-i18n-title="kit.topbar.redo"
          data-i18n-aria="kit.topbar.redo"
          disabled
        >
          ↪&#xFE0E;
        </button>
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" hidden />
      <!-- the language picker (maker-kit's ui/languagePicker) is appended here -->
    </header>
    <!-- what browser storage failed to keep (maker-kit's ui/banner) -->
    <div id="storageNote" class="banner" hidden></div>
    <!-- the view fills it; the panel is a sheet over it on a phone, beside it from 1024 px on the start side -->
    <div id="content" class="workspace">
      <main id="viewWrap" class="view">
        <canvas id="view"></canvas>
        <div id="portCaptions" aria-hidden="true"></div>
        <button id="viewCaption" type="button" aria-live="polite" data-i18n-title="caption.title"></button>
        <!-- the bar over the view (maker-kit's ui/progress) -->
        <div id="progressWrap" class="view-progress" hidden></div>
        <!-- a phone: the panel is a sheet over the view, this opens it (maker-kit's ui/sheet) -->
        <button id="panelBtn" type="button" class="sheet-open" data-i18n="kit.sheet.open" hidden>Settings</button>
      </main>
      <aside id="panel" class="panel open">
        <button
          id="sheetClose"
          type="button"
          class="sheet-handle"
          title="Close the settings"
          aria-label="Close the settings"
          data-i18n-title="kit.sheet.close"
          data-i18n-aria="kit.sheet.close"
        ></button>
        <section class="card">
          <h2 data-i18n="panel.case">Case</h2>
          <div id="caseParams"></div>
        </section>

        <section class="card" id="hingeCard" hidden>
          <h2 data-i18n="panel.hinge">Hinge</h2>
          <div id="hingeParams"></div>
          <ul id="cableCards" class="item-list"></ul>
          <button id="cableAdd" class="btn add-button" type="button" data-i18n="cable.add">Add cable</button>
        </section>

        <!-- a hinged case: the cards that edit one half, under one switch -->
        <div class="half-group" id="halfGroup">
          <div class="half-bar" id="halfBar" hidden>
            <div id="halfParams"></div>
          </div>
          <section class="card">
            <h2 data-i18n="panel.boards">Boards</h2>
            <div id="boardTools"></div>
            <ul id="boardCards" class="item-list"></ul>
            <div class="button-row">
              <button id="boardAdd" class="btn add-button" type="button" data-i18n="boards.add">Add board</button>
              <button id="boardCustom" class="btn add-button" type="button" data-i18n="boards.custom">Custom board</button>
            </div>
          </section>

          <section class="card">
            <h2 data-i18n="panel.lid">Lid</h2>
            <div id="lidParams"></div>
          </section>

          <section class="card">
            <h2 data-i18n="panel.openings">Openings</h2>
            <div id="extraOpenings"></div>
            <ul id="cutCards" class="item-list"></ul>
            <button id="cutAdd" class="btn add-button" type="button" data-i18n="cuts.add">Add opening</button>
          </section>

          <section class="card">
            <h2 data-i18n="panel.labels">Labels</h2>
            <ul id="labelCards" class="item-list"></ul>
            <button id="labelAdd" class="btn add-button" type="button" data-i18n="labels.add">Add label</button>
          </section>
        </div>

        <section class="card" id="mountCard">
          <h2 data-i18n="panel.mounting">Wall mount</h2>
          <div id="extraMounting"></div>
        </section>

        <section class="card" id="exportCard">
          <h2 data-i18n="panel.export">View and export</h2>
          <p class="tabs-caption" data-i18n="show.what">Parts</p>
          <div class="tabs" role="tablist">
            <button
              class="tab"
              id="tabBoth"
              role="tab"
              aria-selected="true"
              data-i18n="export.tab.both"
              data-i18n-title="export.tab.both.title"
            >
              Both
            </button>
            <button
              class="tab"
              id="tabBody"
              role="tab"
              aria-selected="false"
              data-i18n="export.tab.body"
              data-i18n-title="export.tab.body.title"
            >
              Body
            </button>
            <button
              class="tab"
              id="tabLid"
              role="tab"
              aria-selected="false"
              data-i18n="export.tab.lid"
              data-i18n-title="export.tab.lid.title"
            >
              Lid
            </button>
          </div>
          <div id="viewRow">
            <p class="tabs-caption" data-i18n="show.how">View</p>
            <div class="tabs" role="radiogroup" data-i18n-title="view.mode.title">
              <button
                class="tab"
                id="viewExploded"
                role="radio"
                aria-checked="true"
                data-i18n="view.exploded"
                data-i18n-title="view.exploded.title"
              >
                exploded
              </button>
              <button
                class="tab"
                id="viewAssembled"
                role="radio"
                aria-checked="false"
                data-i18n="view.assembled"
                data-i18n-title="view.assembled.title"
              >
                assembled
              </button>
              <button
                class="tab"
                id="viewPrint"
                role="radio"
                aria-checked="false"
                data-i18n="view.print"
                data-i18n-title="view.print.title"
              >
                print layout
              </button>
            </div>
          </div>
          <div id="angleParams" hidden></div>
          <div id="printParams"></div>
          <div class="view-checks">
            <label class="check-inline" id="viewBoardsLabel" data-i18n-title="view.boards.title"
              ><input type="checkbox" id="viewBoards" checked /> <span data-i18n="view.boards">Boards</span></label
            >
            <label class="check-inline" id="viewPortNamesLabel" data-i18n-title="view.portNames.title"
              ><input type="checkbox" id="viewPortNames" checked /> <span data-i18n="view.portNames">Connector names</span></label
            >
            <label class="check-inline" id="viewWarningsLabel" data-i18n-title="view.warnings.title"
              ><input type="checkbox" id="viewWarnings" checked /> <span data-i18n="view.warnings">Warnings on the model</span></label
            >
            <label class="check-inline" data-i18n-title="view.xray.title"
              ><input type="checkbox" id="viewXray" /> <span data-i18n="view.xray">X-ray</span></label
            >
          </div>
          <div class="row">
            <label class="row-name" for="resolution" data-i18n="panel.resolution" data-i18n-title="panel.resolution.hint">Resolution</label>
            <select id="resolution"></select>
          </div>
          <ul id="partList" class="part-list"></ul>
          <button id="exportBtn" class="btn primary wide" data-i18n="export.button">Export STL</button>
          <p id="status"></p>
          <p id="audit"></p>
          <!-- the blockers, warnings and notes (maker-kit's ui/messageList), the counts over them -->
          <p id="messageCount" class="message-count" hidden></p>
          <ul id="messages" class="messages" hidden></ul>
        </section>
      </aside>
    </div>
    <div id="presets" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="presetsTitle">
        <h2 id="presetsTitle" data-i18n="presets.title">Presets</h2>
        <button
          id="presetsClose"
          class="icon-button modal-close"
          type="button"
          data-i18n-title="kit.modal.close"
          data-i18n-aria="kit.modal.close"
          title="Close"
          aria-label="Close"
        >
          ✕
        </button>
        <div class="modal-body"><div id="presetList"></div></div>
      </div>
    </div>
    <div id="boardPicker" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="boardPickerTitle">
        <h2 id="boardPickerTitle" data-i18n="picker.title">Add a board</h2>
        <button
          id="boardPickerClose"
          class="icon-button modal-close"
          type="button"
          data-i18n-title="kit.modal.close"
          data-i18n-aria="kit.modal.close"
          title="Close"
          aria-label="Close"
        >
          ✕
        </button>
        <input type="search" id="boardSearch" autofocus data-i18n-aria="picker.search" aria-label="Search" />
        <div id="boardList" class="modal-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
