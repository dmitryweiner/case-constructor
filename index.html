<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#15181c" />
    <title>Case Constructor — 3D-printable enclosures for boards</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span id="brand">Case Constructor</span>
        <button id="presetBtn" class="tb-btn preset-btn" data-i18n="topbar.presets" data-i18n-title="topbar.presets.title" title="Built-in and saved presets">Presets…</button>
        <button id="saveBtn" class="tb-btn" data-i18n-title="topbar.save.title" title="Save as a preset">💾</button>
        <button id="fileOpenBtn" class="tb-btn" data-i18n-title="topbar.fileOpen.title" title="Open a project file (or drop the file onto the window)">📂</button>
        <button id="fileSaveBtn" class="tb-btn" data-i18n-title="topbar.fileSave.title" title="Save the project to a file">⬇️</button>
        <input type="file" id="fileInput" accept=".json,application/json" hidden />
        <button id="undoBtn" class="tb-btn" data-i18n-title="topbar.undo.title" title="Undo (Ctrl/Cmd+Z)" disabled>↩️</button>
        <button id="redoBtn" class="tb-btn" data-i18n-title="topbar.redo.title" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↪️</button>
        <span class="tb-spacer"></span>
        <button id="panelBtn" class="tb-btn" data-i18n="topbar.panel" data-i18n-title="topbar.panel.title" title="Settings" hidden>⚙ Settings</button>
        <label class="tb-field" id="langField" data-i18n-title="lang.label" title="Language">
          <span class="lang-globe" aria-hidden="true">🌐</span>
          <select id="langSel" data-i18n-aria="lang.label" aria-label="Language"></select>
        </label>
      </header>
      <div id="content">
        <aside id="panel" class="open">
          <section class="card">
            <h2 data-i18n="panel.case">Case</h2>
            <div id="caseParams"></div>
          </section>

          <section class="card">
            <h2 data-i18n="panel.boards">Boards</h2>
            <div id="boardCards"></div>
            <div class="button-row">
              <button id="boardAdd" class="tb-btn" type="button" data-i18n="boards.add">+ Add board</button>
              <button id="boardCustom" class="tb-btn" type="button" data-i18n="boards.custom">+ Custom board</button>
            </div>
          </section>

          <section class="card">
            <h2 data-i18n="panel.lid">Lid</h2>
            <div id="lidParams"></div>
          </section>

          <section class="card">
            <h2 data-i18n="panel.openings">Openings</h2>
            <div id="extraOpenings"></div>
            <div id="cutCards"></div>
            <button id="cutAdd" class="tb-btn wide" type="button" data-i18n="cuts.add">+ Add opening</button>
          </section>

          <section class="card">
            <h2 data-i18n="panel.mounting">Mounting and label</h2>
            <div id="extraMounting"></div>
          </section>

          <section class="card" id="exportCard">
            <h2 data-i18n="panel.export">View and export</h2>
            <p class="tabs-caption" data-i18n="show.what">Parts</p>
            <div class="tabs" role="tablist">
              <button class="tab" id="tabBoth" role="tab" aria-selected="true" data-i18n="export.tab.both" data-i18n-title="export.tab.both.title">Both</button>
              <button class="tab" id="tabBody" role="tab" aria-selected="false" data-i18n="export.tab.body" data-i18n-title="export.tab.body.title">Body</button>
              <button class="tab" id="tabLid" role="tab" aria-selected="false" data-i18n="export.tab.lid" data-i18n-title="export.tab.lid.title">Lid</button>
            </div>
            <div id="viewRow">
            <p class="tabs-caption" data-i18n="show.how">View</p>
            <div class="tabs" role="radiogroup" data-i18n-title="view.mode.title">
              <button class="tab" id="viewExploded" role="radio" aria-checked="true" data-i18n="view.exploded" data-i18n-title="view.exploded.title">exploded</button>
              <button class="tab" id="viewAssembled" role="radio" aria-checked="false" data-i18n="view.assembled" data-i18n-title="view.assembled.title">assembled</button>
              <button class="tab" id="viewPrint" role="radio" aria-checked="false" data-i18n="view.print" data-i18n-title="view.print.title">print layout</button>
            </div>
            </div>
            <div id="printParams"></div>
            <div class="view-checks">
              <label class="check-inline" id="viewBoardsLabel" data-i18n-title="view.boards.title"><input type="checkbox" id="viewBoards" checked /> <span data-i18n="view.boards">Boards</span></label>
              <label class="check-inline" id="viewPortNamesLabel" data-i18n-title="view.portNames.title"><input type="checkbox" id="viewPortNames" checked /> <span data-i18n="view.portNames">Connector names</span></label>
              <label class="check-inline" data-i18n-title="view.xray.title"><input type="checkbox" id="viewXray" /> <span data-i18n="view.xray">X-ray</span></label>
            </div>
            <label class="row">
              <span class="row-label" data-i18n="panel.resolution" data-i18n-title="panel.resolution.hint">Resolution</span>
              <select id="resolution"></select>
            </label>
            <ul id="partList" class="part-list"></ul>
            <button id="exportBtn" class="tb-btn primary wide" data-i18n="export.button">Export STL</button>
            <p id="status"></p>
            <p id="audit"></p>
            <div id="warnings"></div>
            <p id="blockers" class="blockers"></p>
          </section>
        </aside>
        <main id="viewWrap">
          <canvas id="view"></canvas>
          <div id="portCaptions" aria-hidden="true"></div>
          <button id="viewCaption" type="button" aria-live="polite" data-i18n-title="caption.title"></button>
          <div id="presets" hidden>
            <div id="presetsBox" role="dialog" aria-labelledby="presetsTitle">
              <button id="presetsClose" class="panel-close" type="button" data-i18n-title="presets.close.title" data-i18n-aria="presets.close" title="Close (Esc)" aria-label="Close">✕</button>
              <h2 id="presetsTitle" data-i18n="presets.title">Presets</h2>
              <div id="presetList"></div>
            </div>
          </div>
          <div id="boardPicker" class="modal" hidden>
            <div class="modal-box" role="dialog" aria-labelledby="boardPickerTitle">
              <button id="boardPickerClose" class="panel-close" type="button" data-i18n-title="presets.close.title" data-i18n-aria="presets.close" title="Close (Esc)" aria-label="Close">✕</button>
              <h2 id="boardPickerTitle" data-i18n="picker.title">Add a board</h2>
              <input type="search" id="boardSearch" data-i18n-aria="picker.search" aria-label="Search" />
              <div id="boardList"></div>
            </div>
          </div>
          <div id="progressWrap" hidden>
            <div id="progressBar"><div id="progressFill"></div></div>
            <span id="progressLabel"></span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
